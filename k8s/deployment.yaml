apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-gke-cicd
  namespace: node-gke-cicd
  labels:
    app.kubernetes.io/name: node-gke-cicd
    app.kubernetes.io/part-of: node-gke-cicd
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: node-gke-cicd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-gke-cicd
        app.kubernetes.io/part-of: node-gke-cicd
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-gke-cicd
          image: node-gke-cicd:local
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: production
            - name: APP_NAME
              value: Node GKE CI/CD Demo
            - name: APP_VERSION
              value: local
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
