apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: node-gke-cicd
  namespace: node-gke-cicd
  labels:
    app.kubernetes.io/name: node-gke-cicd
    app.kubernetes.io/part-of: node-gke-cicd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: node-gke-cicd
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

