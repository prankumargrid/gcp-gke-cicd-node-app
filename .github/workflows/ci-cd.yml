name: ci-cd

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'node-gke-cicd' }}
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'node-gke-cicd' }}

jobs:
  test:
    name: Test Node application
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static syntax check
        run: npm run check

      - name: Run unit tests
        run: npm test

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  image:
    name: Build, scan, and push image
    runs-on: ubuntu-24.04
    needs:
      - test
      - terraform-validate
    permissions:
      contents: read
      id-token: write
      security-events: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment variables
        if: github.event_name != 'pull_request'
        run: |
          required=(PROJECT_ID REGION GAR_REPOSITORY WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub repository variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Resolve image URI
        id: image
        run: |
          if [ -n "${PROJECT_ID}" ] && [ -n "${REGION}" ] && [ -n "${GAR_REPOSITORY}" ]; then
            echo "uri=${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "uri=local/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image for scan
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.uri }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Trivy vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}:${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Write Trivy SARIF
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF to code scanning
        if: always() && github.event_name != 'pull_request' && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Log in to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push immutable image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ steps.image.outputs.uri }}:${IMAGE_TAG}"

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-24.04
    needs:
      - image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
      GKE_LOCATION: ${{ vars.GKE_LOCATION }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment variables
        run: |
          required=(PROJECT_ID REGION GAR_REPOSITORY GKE_CLUSTER GKE_LOCATION WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT)
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub repository variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Deploy Kubernetes manifests
        run: |
          image_uri="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"
          rendered_deployment="$(mktemp)"

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl set image -f k8s/deployment.yaml node-gke-cicd="${image_uri}" --local -o yaml > "${rendered_deployment}"
          kubectl set env -f "${rendered_deployment}" APP_VERSION="${GITHUB_SHA}" --local -o yaml | kubectl apply -f -
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/node-gke-cicd --timeout=300s

      - name: Publish service endpoint summary
        run: |
          endpoint=""
          for _ in $(seq 1 30); do
            endpoint="$(kubectl -n "${K8S_NAMESPACE}" get service node-gke-cicd -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)"
            if [ -n "${endpoint}" ]; then
              break
            fi
            sleep 10
          done

          if [ -n "${endpoint}" ]; then
            echo "Application URL: http://${endpoint}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "LoadBalancer endpoint is still pending. Check it with: kubectl -n ${K8S_NAMESPACE} get svc node-gke-cicd" >> "$GITHUB_STEP_SUMMARY"
          fi

  notify:
    name: Notify pipeline status
    runs-on: ubuntu-24.04
    needs:
      - test
      - terraform-validate
      - image
      - deploy
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Summarize status
        run: |
          status="success"
          for result in "${{ needs.test.result }}" "${{ needs['terraform-validate'].result }}" "${{ needs.image.result }}" "${{ needs.deploy.result }}"; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              status="failure"
            fi
          done

          {
            echo "Pipeline status: ${status}"
            echo "Test: ${{ needs.test.result }}"
            echo "Terraform: ${{ needs['terraform-validate'].result }}"
            echo "Image: ${{ needs.image.result }}"
            echo "Deploy: ${{ needs.deploy.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          status="success"
          for result in "${{ needs.test.result }}" "${{ needs['terraform-validate'].result }}" "${{ needs.image.result }}" "${{ needs.deploy.result }}"; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              status="failure"
            fi
          done

          payload="$(jq -n \
            --arg text "ci-cd ${status}: $GITHUB_REPOSITORY@$GITHUB_SHA" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{text: ($text + "\n" + $url)}')"

          curl -fsS -X POST -H "Content-Type: application/json" --data "$payload" "$SLACK_WEBHOOK_URL"
